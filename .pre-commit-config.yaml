
repos:
  # Check JavaScript syntax
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.17.0
    hooks:
      - id: eslint
        files: \.(js|jsx)$
        types: [file]
        additional_dependencies:
          - eslint@9.17.0

  # Verify webpack build works
  - repo: local
    hooks:
      - id: webpack-build
        name: webpack build check
        entry: npm run build
        language: system
        pass_filenames: false
        files: \.(js|html|css)$
